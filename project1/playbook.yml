---
- name: Deploy Docker container on EC2 instances
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt cache and install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull image and run container from Docker Hub
      command: docker run -d --name my-app -p 80:80 nginx:latest
     
